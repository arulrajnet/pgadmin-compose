configs:
  servers.json:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "PostgreSQL",
            "Group": "Servers",
            "Port": ${POSTGRES_PORT:-5432},
            "Username": "${POSTGRES_USER}",
            "Host": "${POSTGRES_HOST:-pgsql}",
            "PassFile": "/pgpass-writable/pgpass",
            "SSLMode": "prefer",
            "MaintenanceDB": "${POSTGRES_DB}",
            "DBRestriction": "${POSTGRES_DB}",
            "DBRestrictionType": "databases"
          }
        }
      }

services:
  pgsql:
    image: postgres:${POSTGRES_VERSION}
    ports:
      - 5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: ${PGDATA}
    volumes:
      - pgdata:${PGDATA}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  init-pgpass:
    image: alpine:latest
    command: >
      sh -c '
      echo "${POSTGRES_HOST:-pgsql}:${POSTGRES_PORT:-5432}:*:${POSTGRES_USER}:${POSTGRES_PASSWORD}" > /pgpass-writable/pgpass &&
      chmod 600 /pgpass-writable/pgpass &&
      chown 5050:5050 /pgpass-writable/pgpass &&
      echo "pgpass file created successfully"
      '
    volumes:
      - pgpass-vol:/pgpass-writable

  pgadmin:
    image: dpage/pgadmin4:${PGADMIN_VERSION}
    volumes:
      - pgadmindata:/var/lib/pgadmin
      - pgpass-vol:/pgpass-writable:ro
    configs:
      - source: servers.json
        target: /pgadmin4/servers.json
    ports:
      - 38001:8080
    environment:
      PGPASS_FILE: /pgpass-writable/pgpass
      # This needs to be defined even if master password is not required
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_ADDRESS: 0.0.0.0
      PGADMIN_LISTEN_PORT: 8080
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: False
      PGADMIN_CONFIG_SERVER_MODE: False
      POSTGRES_HOST: ${POSTGRES_HOST:-pgsql}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      init-pgpass:
        condition: service_completed_successfully

volumes:
  pgdata:
  pgadmindata:
  pgpass-vol:
